[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cybermap"
version = "2.0.1"
description = "CyberMap: multi-engine asset mapping CLI, MCP server and workflow agent (fork of FofaMap)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.116,<1",
  "httpx[http2]>=0.28,<1",
  # MCP 2.x transport; the floor picks up the PYSEC-2026-3846/3848/3849 fixes.
  "httpx2>=2.12,<3",
  "jsonschema>=4.25,<5",
  "mcp>=2.2,<3",
  "mmh3>=5,<6",
  "opentelemetry-api>=1.28,<2",
  "pydantic>=2.11,<3",
  "PyJWT[crypto]>=2.15,<3",
  "PyYAML>=6,<7",
  "questionary>=2.1,<3",
  "rich>=14,<16",
  "rich-click>=1.8,<2",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "xlsxwriter>=3.2,<4",
  "keyring>=25,<26",
]

[project.optional-dependencies]
scan = []
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
cybermap = "cybermap:main"
cybermap-api = "service.api:main"
cybermap-mcp = "mcp_server:run_server"

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "providers", "service", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"cybermap.py" = "cybermap.py"
"mcp_server.py" = "mcp_server.py"
"agent-kit" = "agent-kit"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in tests that call real FOFA/model APIs and may consume quota"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]
